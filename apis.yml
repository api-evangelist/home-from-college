aid: home-from-college
name: Home From College
description: 'Home From College (H\FC) is an AI-powered growth platform that connects
  college students with paid work from consumer brands. Students earn money and build
  professional experience through microGIGs (quick paid tasks such as app installs,
  surveys, product feedback, and social sharing with instant payment) and GIGs (larger,
  ongoing opportunities including content creation, brand-ambassador roles, product
  testing, and internships), while brands reach and activate Gen Z talent for marketing
  campaigns. Backed by GV, Home From College runs a two-sided marketplace across a
  student mobile app and a brand-facing web platform. No public developer program,
  API documentation, or SDKs were found during enrichment.'
